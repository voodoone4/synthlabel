[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "voodoone4-synthlabel"
version = "0.1.0"
description = "为每条合成数据记录生成方式、筛选依据与不确定度，随数据一起流转。"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "voodoone4" }]
keywords = ["synthetic-data", "provenance", "dataset", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://voodoone4.github.io"
Repository = "https://github.com/voodoone4/synthlabel"
Issues = "https://github.com/voodoone4/synthlabel/issues"

[project.scripts]
synthlabel = "synthlabel:main"

[tool.setuptools]
py-modules = ["synthlabel"]
